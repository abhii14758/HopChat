name: Release

on:
  push:
    branches: [main]

# Uses npm's Trusted Publishing (OIDC) -- no NPM_TOKEN secret needed. One-time
# setup required before this can publish: on npmjs.com, go to the hopchat
# package's Settings -> Trusted Publisher -> GitHub Actions, and set
# organization/user "abhii14758", repository "HopChat", workflow filename
# "release.yml". Until that's configured, the publish step will fail closed
# (safely) rather than publish -- the "Version Packages" PR step still works
# either way, so changesets accumulate correctly in the meantime.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      # npm's OIDC trusted publishing needs npm >=11.5.1; Node 22.x currently
      # bundles 10.9.x, which silently ignores the OIDC token and fails the
      # publish step with ENEEDAUTH instead of using it.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
